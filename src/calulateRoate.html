<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Rotation Calculation</title>
    <!-- 引入 Turf.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
    <!-- 引入 Leaflet.js 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --border: rgba(0, 0, 0, 0.08);
            --border-focus: #0071e3;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --accent-active: #006edb;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.06);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            padding: 48px 24px 64px;
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
            background: var(--bg);
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .page-header p {
            margin: 0;
            font-size: 17px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            padding: 28px 32px;
            margin-bottom: 24px;
        }

        .card-title {
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .card-desc {
            margin: 0 0 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 32px 16px 48px;
            }

            .card {
                padding: 20px;
            }
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }

        .field input[type="text"],
        .field textarea {
            width: 100%;
            padding: 11px 14px;
            font-family: var(--font);
            font-size: 15px;
            color: var(--text-primary);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .field input[type="text"]::placeholder,
        .field textarea::placeholder {
            color: var(--text-tertiary);
        }

        .field input[type="text"]:focus,
        .field textarea:focus {
            border-color: var(--border-focus);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
        }

        .field textarea {
            resize: vertical;
            min-height: 140px;
            line-height: 1.6;
            font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
        }

        .field-full {
            margin-bottom: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 22px;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 980px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            letter-spacing: -0.01em;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            background: var(--accent-active);
            transform: scale(0.98);
        }

        .result-block {
            margin-top: 24px;
            padding: 18px 20px;
            background: var(--bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        .result-block h2 {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
        }

        .result-block p {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            min-height: 1.5em;
        }

        .result-block p:empty::before {
            content: "—";
            color: var(--text-tertiary);
            font-weight: 400;
        }

        #map {
            height: 520px;
            width: 100%;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-top: 20px;
        }

        .path-point-marker {
            cursor: pointer;
        }

        .path-point-popup .leaflet-popup-content-wrapper {
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .path-point-popup .leaflet-popup-content {
            margin: 10px 14px;
            font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .path-point-popup .leaflet-popup-tip {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .marker-icon {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="page-header">
            <h1>地图渲染工具</h1>
            <p>坐标旋转计算与路径可视化</p>
        </header>

        <section class="card">
            <h2 class="card-title">Point Rotation Calculation</h2>
            <p class="card-desc">输入司机点与目标点坐标，计算两点间的旋转角度。</p>
            <div class="field field-full">
                <label for="carMarkerInput">司机点经纬度</label>
                <input type="text" id="carMarkerInput" placeholder='请输入司机点经纬度, e.g. 36.245109100334226,120.40522890991846'>
            </div>
            <div class="field field-full">
                <label for="destPointInput">目标点经纬度</label>
                <input type="text" id="destPointInput" placeholder='请输入目标点经纬度, e.g. 36.245109100334226,120.40522890991846'>
            </div>
            <button id="calculateButton" class="btn">计算旋转角度</button>
            <div class="result-block">
                <h2>结果</h2>
                <p id="result"></p>
            </div>
        </section>

        <section class="card">
            <h2 class="card-title">Map with Polyline and Markers</h2>
            <p class="card-desc">粘贴路径点 JSON，并可选填写司机点与目标点，在地图上绘制折线与标记。</p>
            <div class="field field-full">
                <label for="pointsInput">路径点数据</label>
                <textarea id="pointsInput" rows="10" cols="150" placeholder='请输入数组对象格式, e.g. [{"lat": 40.0252387, "lng": 118.72192389999998}, ...]'></textarea>
            </div>
            <div class="field field-full">
                <label for="driverPointInput">司机点经纬度</label>
                <input type="text" id="driverPointInput" placeholder='请输入司机点经纬度, e.g. 36.245109100334226,120.40522890991846'>
            </div>
            <div class="field field-full">
                <label for="targetPointInput">目标点经纬度</label>
                <input type="text" id="targetPointInput" placeholder='请输入目标点经纬度, e.g. 36.245109100334226,120.40522890991846'>
            </div>
            <button id="drawButton" class="btn">地图绘制</button>
            <div id="map"></div>
        </section>
    </div>

    <script>
        // 引入 Turf.js 方法
        const turfPoint = turf.point;
        const bearing = turf.bearing;

        // 计算旋转角度的函数
        function getPointRotate(carMarker, destPoint = {}) {
            const startPt = turfPoint([carMarker.longitude, carMarker.latitude]);
            const endPt = turfPoint([destPoint.longitude, destPoint.latitude]);
            const angle = bearing(startPt, endPt); // 0 - 360度
            return Math.floor((360 + angle) % 360);
        }

        function parseLatLngInput(raw) {
            const parts = raw.trim().split(',').map(function (s) { return s.trim(); });
            if (parts.length < 2) return null;
            const lat = parseFloat(parts[0]);
            const lng = parseFloat(parts[1]);
            if (isNaN(lat) || isNaN(lng)) return null;
            return { latitude: lat, longitude: lng };
        }

        // 处理按钮点击事件
        document.getElementById('calculateButton').addEventListener('click', function() {
            const carMarker = parseLatLngInput(document.getElementById('carMarkerInput').value);
            const destPoint = parseLatLngInput(document.getElementById('destPointInput').value);

            if (!carMarker || !destPoint) {
                alert('请输入有效的经纬度，格式：纬度,经度');
                return;
            }

            const result = getPointRotate(carMarker, destPoint);
            document.getElementById('result').innerText = `Rotation Angle: ${result} degrees`;
        });
    </script>

    <!-- 引入 Leaflet.js 库 -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // GCJ-02 <-> WGS-84 坐标转换
        const GCJ02 = (function () {
            const PI = Math.PI;
            const a = 6378245.0;
            const ee = 0.00669342162296594323;

            function outOfChina(lng, lat) {
                return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
            }

            function transformLat(x, y) {
                let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y +
                    0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
                ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
                ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
                ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
                return ret;
            }

            function transformLng(x, y) {
                let ret = 300.0 + x + 2.0 * y + 0.1 * x * x +
                    0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
                ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
                ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
                ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
                return ret;
            }

            function gcj02ToWgs84(lng, lat) {
                if (outOfChina(lng, lat)) return { lat, lng };
                let dLat = transformLat(lng - 105.0, lat - 35.0);
                let dLng = transformLng(lng - 105.0, lat - 35.0);
                const radLat = lat / 180.0 * PI;
                let magic = Math.sin(radLat);
                magic = 1 - ee * magic * magic;
                const sqrtMagic = Math.sqrt(magic);
                dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * PI);
                dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * PI);
                return { lat: lat - dLat, lng: lng - dLng };
            }

            return { gcj02ToWgs84 };
        })();

        // 输入按 GCJ-02（高德/滴滴等）处理，统一转为 WGS-84 以匹配 OSM 底图
        function convertPoint(lat, lng) {
            return GCJ02.gcj02ToWgs84(lng, lat);
        }

        // 初始化地图
        const map = L.map('map').setView([40.0252387, 118.72192389999998], 15);

        // 添加 OpenStreetMap 瓦片图层（WGS-84）
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 路径点默认/选中样式
        const PATH_POINT_STYLE = {
            default: { radius: 5, fillColor: '#006400', color: '#006400', weight: 1, opacity: 1, fillOpacity: 1 },
            active: { radius: 8, fillColor: '#0071e3', color: '#0071e3', weight: 2, opacity: 1, fillOpacity: 1 }
        };

        let activePathMarker = null;

        function formatLatLngString(point) {
            return point.lat + ',' + point.lng;
        }

        function clearSelectedPointInfo() {
            if (activePathMarker) {
                activePathMarker.setStyle(PATH_POINT_STYLE.default);
                activePathMarker.closePopup();
                activePathMarker = null;
            }
            map.closePopup();
        }

        function setActivePathMarker(marker) {
            if (activePathMarker && activePathMarker !== marker) {
                activePathMarker.setStyle(PATH_POINT_STYLE.default);
                activePathMarker.closePopup();
            }
            activePathMarker = marker;
            marker.setStyle(PATH_POINT_STYLE.active);
            marker.bringToFront();
            marker.openPopup();
        }

        // 绘制地图的函数
        function drawMap(latLngArray, singlePoint, secondPoint) {
            console.log('luov---drawMap', singlePoint)
            clearSelectedPointInfo();
            // 清除现有的图层
            map.eachLayer((layer) => {
                if (layer instanceof L.Marker || layer instanceof L.Polyline || layer instanceof L.CircleMarker) {
                    map.removeLayer(layer);
                }
            });

            // 将经纬度点转换为 Leaflet 的 LatLng 对象（GCJ-02 → WGS-84）
            const latLngs = latLngArray.map(point => {
                const c = convertPoint(parseFloat(point.lat), parseFloat(point.lng));
                return [c.lat, c.lng];
            });

            // 在地图上绘制线
            const polyline = L.polyline(latLngs, {
                color: 'green',
                weight: 5,
                opacity: 1,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            // 添加标记
            latLngArray.forEach((point) => {
                const c = convertPoint(parseFloat(point.lat), parseFloat(point.lng));
                const latLng = [c.lat, c.lng];
                const marker = L.circleMarker(latLng, Object.assign({ className: 'path-point-marker' }, PATH_POINT_STYLE.default)).addTo(map);
                marker.bindPopup(formatLatLngString(point), {
                    closeButton: false,
                    autoClose: false,
                    className: 'path-point-popup'
                });
                marker.on('click', function (e) {
                    L.DomEvent.stopPropagation(e);
                    setActivePathMarker(marker);
                });
            });

            // 如果有单个点，添加标记
            if (singlePoint) {
                const sc = convertPoint(parseFloat(singlePoint.lat), parseFloat(singlePoint.lng));
                const latLng = [sc.lat, sc.lng];
                const driverIcon = L.icon({
                    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                    iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
                    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                });
                L.marker(latLng, { icon: driverIcon }).addTo(map).bindPopup('司机');
            }

            // 如果有第二点，添加标记
            if (secondPoint) {
                const tc = convertPoint(parseFloat(secondPoint.lat), parseFloat(secondPoint.lng));
                const latLng = [tc.lat, tc.lng];
                const marker = L.circleMarker(latLng, {
                    radius: 5,
                    fillColor: 'orange',
                    color: 'orange',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 1
                }).addTo(map);
            }

            // 调整地图视图以适应线的范围
            map.fitBounds(polyline.getBounds());
        }
    </script><script>
// 绑定地图绘制按钮事件
(function () {
  const btn = document.getElementById('drawButton');
  if (!btn) return;
  btn.addEventListener('click', function () {
    // 解析路径点 JSON
    const pointsText = document.getElementById('pointsInput').value.trim();
    if (!pointsText) {
      alert('请输入路径点数据');
      return;
    }
    let points;
    try {
      points = JSON.parse(pointsText);
      if(typeof points === 'string') {
        points = JSON.parse(points);
      }
    } catch (e) {
      alert('pointsInput 不是有效的 JSON 数组');
      return;
    }
    if (!Array.isArray(points)) {
      alert('pointsInput 必须为数组');
      return;
    }

    const latLngArray = points
      .map(function (p) {
        const lat = parseFloat((p && (p.lat ?? p.latitude)));
        const lng = parseFloat((p && (p.lng ?? p.longitude)));
        return { lat: lat, lng: lng };
      })
      .filter(function (p) { return !isNaN(p.lat) && !isNaN(p.lng); });

    if (latLngArray.length === 0) {
      alert('未解析到有效的路径点');
      return;
    }

    // 解析司机点 "lat,lng"
    const driverRaw = document.getElementById('driverPointInput').value.trim();
    var singlePoint = null;
    if (driverRaw) {
      const parts = driverRaw.split(',').map(function (s) { return s.trim(); });
      if (parts.length >= 2) {
        const lat = parseFloat(parts[0]);
        const lng = parseFloat(parts[1]);
        if (!isNaN(lat) && !isNaN(lng)) {
          singlePoint = { lat: lat, lng: lng };
        }
      }
    }

    // 解析目标点 "lat,lng"
    const targetRaw = document.getElementById('targetPointInput').value.trim();
    var secondPoint = null;
    if (targetRaw) {
      const parts = targetRaw.split(',').map(function (s) { return s.trim(); });
      if (parts.length >= 2) {
        const lat = parseFloat(parts[0]);
        const lng = parseFloat(parts[1]);
        if (!isNaN(lat) && !isNaN(lng)) {
          secondPoint = { lat: lat, lng: lng };
        }
      }
    }

    // 调用已有函数进行绘制
    if (typeof drawMap === 'function') {
      drawMap(latLngArray, singlePoint, secondPoint);
    } else {
      alert('drawMap 未定义，请检查脚本加载顺序');
    }
  });
})();
</script>
</body>
</html>
